<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1512" />
      <stop offset="100%" stop-color="#142820" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" />

  <text x="60" y="70" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="800">WildGuard AI</text>
  <text x="60" y="98" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="14">Intelligent Wildlife Surveillance &amp; Human-Wildlife Conflict Prevention</text>

  <!-- Vision HUD Monitor View -->
  <g transform="translate(100, 130)">
    <rect width="600" height="240" rx="14" fill="#06120e" stroke="#10b981" stroke-width="2" />
    
    <!-- Camera feed overlays -->
    <text x="25" y="35" fill="#10b981" font-family="monospace" font-size="12" font-weight="700">● LIVE CAM FEED #04 - PERIMETER WEST</text>
    <text x="470" y="35" fill="#34d399" font-family="monospace" font-size="12">FPS: 32.4 | INF-RT</text>

    <!-- Crosshair Target Box (Elephant / Wildlife Detection) -->
    <g transform="translate(180, 50)">
      <!-- Target Bounding Box -->
      <rect width="240" height="150" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="10 5" filter="url(#glow)" />
      
      <!-- Corner Markers -->
      <path d="M0,20 L0,0 L20,0 M220,0 L240,0 L240,20 M240,130 L240,150 L220,150 M20,150 L0,150 L0,130" fill="none" stroke="#ef4444" stroke-width="3" />
      
      <!-- Label -->
      <rect x="0" y="-24" width="160" height="24" fill="#ef4444" />
      <text x="8" y="-7" fill="#ffffff" font-family="monospace" font-size="12" font-weight="700">ALERT: ELEPHANT (98.7%)</text>
      
      <!-- Target Center Cross -->
      <line x1="110" y1="75" x2="130" y2="75" stroke="#ef4444" stroke-width="2" />
      <line x1="120" y1="65" x2="120" y2="85" stroke="#ef4444" stroke-width="2" />
    </g>

    <!-- Warning banner bottom -->
    <rect x="25" y="195" width="550" height="30" rx="6" fill="#1f1315" stroke="#ef4444" stroke-width="1" />
    <text x="40" y="215" fill="#f87171" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">⚠ Automated Deterrent System Armed | GeoFence Breached at Sector 7B</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#70e000" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" />

  <!-- Orb Glow -->
  <circle cx="400" cy="210" r="130" fill="#00f5d4" opacity="0.08" filter="url(#glow)"/>
  <circle cx="400" cy="210" r="70" fill="#38bdf8" opacity="0.15" filter="url(#glow)"/>

  <!-- Voice Waves Dynamic -->
  <g transform="translate(150, 160)" stroke="url(#wave)" stroke-width="4" stroke-linecap="round">
    <line x1="20" y1="50" x2="20" y2="50" />
    <line x1="40" y1="40" x2="40" y2="60" />
    <line x1="60" y1="30" x2="60" y2="70" />
    <line x1="80" y1="15" x2="80" y2="85" />
    <line x1="100" y1="35" x2="100" y2="65" />
    <line x1="120" y1="10" x2="120" y2="90" />
    <line x1="140" y1="2" x2="140" y2="98" />
    <line x1="160" y1="20" x2="160" y2="80" />
    <line x1="180" y1="30" x2="180" y2="70" />
    <line x1="200" y1="5" x2="200" y2="95" stroke-width="5" />
    <line x1="220" y1="0" x2="220" y2="100" stroke-width="6" />
    <line x1="240" y1="15" x2="240" y2="85" />
    <line x1="260" y1="25" x2="260" y2="75" />
    <line x1="280" y1="5" x2="280" y2="95" />
    <line x1="300" y1="20" x2="300" y2="80" />
    <line x1="320" y1="10" x2="320" y2="90" stroke-width="5" />
    <line x1="340" y1="35" x2="340" y2="65" />
    <line x1="360" y1="15" x2="360" y2="85" />
    <line x1="380" y1="30" x2="380" y2="70" />
    <line x1="400" y1="2" x2="400" y2="98" />
    <line x1="420" y1="25" x2="420" y2="75" />
    <line x1="440" y1="40" x2="440" y2="60" />
    <line x1="460" y1="45" x2="460" y2="55" />
    <line x1="480" y1="50" x2="480" y2="50" />
  </g>

  <!-- Central Interface Capsule -->
  <g transform="translate(240, 290)">
    <rect width="320" height="60" rx="30" fill="#091322" stroke="#00f5d4" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="35" cy="30" r="14" fill="#00f5d4" />
    <path d="M30,25 L42,30 L30,35 Z" fill="#0a0f1d"/>
    <text x="65" y="27" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">VoiceOS Core</text>
    <text x="65" y="44" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Ollama + Local LLMs • STT &amp; TTS</text>
    <rect x="235" y="18" width="65" height="24" rx="12" fill="#00f5d4" fill-opacity="0.15" stroke="#00f5d4" stroke-width="1"/>
    <text x="246" y="34" fill="#00f5d4" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700">ONGOING</text>
  </g>

  <!-- Title Top -->
  <text x="400" y="80" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="800" letter-spacing="1.5">VoiceOS</text>
  <text x="400" y="110" text-anchor="middle" fill="#7dd3fc" font-family="'Segoe UI', sans-serif" font-size="14">Intelligent AI Voice Assistant with Local Intelligence</text>
</svg>
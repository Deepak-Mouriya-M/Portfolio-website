<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1215" />
      <stop offset="100%" stop-color="#112224" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" />

  <text x="60" y="70" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="800">Budget &amp; Expense Tracker</text>
  <text x="60" y="98" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="14">MERN Stack • Financial Analytics • Budget Categorization</text>

  <!-- Financial Dashboard UI -->
  <g transform="translate(60, 130)">
    <!-- Main Panel -->
    <rect width="680" height="250" rx="14" fill="#0b171c" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Stat 1 -->
    <rect x="25" y="25" width="190" height="70" rx="10" fill="#132328" stroke="#1f3d3d" />
    <text x="45" y="50" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Total Monthly Budget</text>
    <text x="45" y="75" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="800">₹45,000</text>

    <!-- Stat 2 -->
    <rect x="245" y="25" width="190" height="70" rx="10" fill="#132328" stroke="#1f3d3d" />
    <text x="265" y="50" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Actual Expenses</text>
    <text x="265" y="75" fill="#f87171" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="800">₹28,450</text>

    <!-- Stat 3 -->
    <rect x="465" y="25" width="190" height="70" rx="10" fill="#132328" stroke="#1f3d3d" />
    <text x="485" y="50" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Net Savings</text>
    <text x="485" y="75" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="800">₹16,550</text>

    <!-- Chart visual -->
    <g transform="translate(25, 115)">
      <rect width="630" height="110" rx="10" fill="#081014" stroke="#162e2a" />
      <!-- Wave Path -->
      <path d="M20,80 Q90,30 160,65 T300,40 T440,55 T580,20 L610,25 L610,95 L20,95 Z" fill="url(#chartGrad)" />
      <path d="M20,80 Q90,30 160,65 T300,40 T440,55 T580,20 L610,25" fill="none" stroke="#10b981" stroke-width="3" />
      <circle cx="300" cy="40" r="4" fill="#34d399" />
      <circle cx="580" cy="20" r="5" fill="#34d399" stroke="#ffffff" stroke-width="2" />
    </g>
  </g>
</svg>
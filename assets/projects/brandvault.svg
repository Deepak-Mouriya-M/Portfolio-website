<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#1e1124" />
      <stop offset="100%" stop-color="#2a0815" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4d6d" />
      <stop offset="100%" stop-color="#b74b4b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#7b2cbf" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" />
  
  <!-- Subtle grid -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.04">
    <path d="M0,75 H800 M0,150 H800 M0,225 H800 M0,300 H800 M0,375 H800" />
    <path d="M100,0 V450 M200,0 V450 M300,0 V450 M400,0 V450 M500,0 V450 M600,0 V450 M700,0 V450" />
  </g>

  <!-- Glowing background elements -->
  <circle cx="650" cy="120" r="140" fill="#b74b4b" opacity="0.15" filter="url(#glow)"/>
  <circle cx="200" cy="350" r="120" fill="#7b2cbf" opacity="0.12" filter="url(#glow)"/>

  <!-- BrandVault UI Mockup Window -->
  <g transform="translate(140, 60)">
    <!-- Window Container -->
    <rect width="520" height="310" rx="16" fill="#111625" stroke="#ff4d6d" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Top Bar -->
    <rect width="520" height="42" rx="16" fill="#161d30" />
    <rect y="26" width="520" height="16" fill="#161d30" />
    <circle cx="25" cy="21" r="5" fill="#ff5f56" />
    <circle cx="42" cy="21" r="5" fill="#ffbd2e" />
    <circle cx="59" cy="21" r="5" fill="#27c93f" />
    <text x="90" y="26" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="500">brandvault-ai-1.onrender.com</text>
    
    <!-- Live Badge -->
    <rect x="420" y="12" width="75" height="20" rx="10" fill="#059669" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <circle cx="432" cy="22" r="3" fill="#10b981" />
    <text x="442" y="26" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700">LIVE DEMO</text>

    <!-- BrandVault AI Centerpiece -->
    <g transform="translate(60, 75)">
      <!-- AI Hexagon / Diamond Logo -->
      <polygon points="50,10 90,35 90,85 50,110 10,85 10,35" fill="none" stroke="url(#primary)" stroke-width="3" filter="url(#glow)"/>
      <polygon points="50,25 78,42 78,78 50,95 22,78 22,42" fill="url(#primary)" fill-opacity="0.15" stroke="#ffffff" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="50" cy="60" r="10" fill="#ff4d6d" />
      
      <!-- Typography & Visual Mockup -->
      <text x="120" y="45" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="800" letter-spacing="1">BrandVault AI</text>
      <text x="120" y="70" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="13">Autonomous AI Brand Identity &amp; Asset Generator</text>
      
      <!-- Mini Cards -->
      <g transform="translate(120, 95)">
        <rect width="80" height="40" rx="8" fill="#1e293b" stroke="#334155" />
        <rect x="10" y="10" width="30" height="6" rx="3" fill="#ff4d6d" />
        <rect x="10" y="22" width="55" height="5" rx="2" fill="#64748b" />

        <rect x="95" width="80" height="40" rx="8" fill="#1e293b" stroke="#334155" />
        <rect x="105" y="10" width="30" height="6" rx="3" fill="#00f5d4" />
        <rect x="105" y="22" width="55" height="5" rx="2" fill="#64748b" />

        <rect x="190" width="80" height="40" rx="8" fill="#1e293b" stroke="#334155" />
        <rect x="200" y="10" width="30" height="6" rx="3" fill="#fbbf24" />
        <rect x="200" y="22" width="55" height="5" rx="2" fill="#64748b" />
      </g>
    </g>

    <!-- Bottom Feature Bar -->
    <rect x="40" y="240" width="440" height="40" rx="10" fill="#0c101d" stroke="#1e293b" />
    <text x="60" y="265" fill="#f43f5e" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">⚡ Real-time Brand Engine</text>
    <text x="230" y="265" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">🎨 Dynamic Color Palettes</text>
    <text x="390" y="265" fill="#a78bfa" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">🚀 Full Deployed</text>
  </g>
</svg>
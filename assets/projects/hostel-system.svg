<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f1a" />
      <stop offset="100%" stop-color="#211226" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" />

  <text x="60" y="70" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="800">Hostel Complaint Management</text>
  <text x="60" y="98" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="14">Full-Stack Web App • Ticket Dispatch • Status Lifecycle Tracker</text>

  <!-- Ticket Workflow UI -->
  <g transform="translate(60, 130)">
    <!-- Container -->
    <rect width="680" height="240" rx="14" fill="#171220" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Header -->
    <rect x="25" y="20" width="630" height="40" rx="8" fill="#241a33" />
    <text x="45" y="45" fill="#e9d5ff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">Ticket ID</text>
    <text x="160" y="45" fill="#e9d5ff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">Category</text>
    <text x="320" y="45" fill="#e9d5ff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">Room / Block</text>
    <text x="470" y="45" fill="#e9d5ff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">Status</text>

    <!-- Row 1 -->
    <g transform="translate(25, 75)">
      <rect width="630" height="42" rx="6" fill="#1c1527" />
      <text x="20" y="26" fill="#94a3b8" font-family="monospace" font-size="12">#TK-8941</text>
      <text x="135" y="26" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12">Wi-Fi Connection</text>
      <text x="295" y="26" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">Block B - 304</text>
      <rect x="445" y="10" width="90" height="22" rx="11" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
      <text x="468" y="25" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700">RESOLVED</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(25, 125)">
      <rect width="630" height="42" rx="6" fill="#1c1527" />
      <text x="20" y="26" fill="#94a3b8" font-family="monospace" font-size="12">#TK-8942</text>
      <text x="135" y="26" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12">Electrical Outlet</text>
      <text x="295" y="26" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">Block A - 112</text>
      <rect x="445" y="10" width="90" height="22" rx="11" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" />
      <text x="460" y="25" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700">IN PROGRESS</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(25, 175)">
      <rect width="630" height="42" rx="6" fill="#1c1527" />
      <text x="20" y="26" fill="#94a3b8" font-family="monospace" font-size="12">#TK-8943</text>
      <text x="135" y="26" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12">Water Plumbing</text>
      <text x="295" y="26" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12">Block C - 201</text>
      <rect x="445" y="10" width="90" height="22" rx="11" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
      <text x="473" y="25" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700">ASSIGNED</text>
    </g>
  </g>
</svg>
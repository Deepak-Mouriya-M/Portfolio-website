<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f" />
      <stop offset="100%" stop-color="#191932" />
    </linearGradient>
    <linearGradient id="tfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)" />

  <!-- Top Title -->
  <text x="60" y="70" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="800">Image Caption Generator</text>
  <text x="60" y="98" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="14">Deep Learning (CNN + LSTM / Attention) • TensorFlow • Keras</text>

  <!-- Left Side: Input Image Frame -->
  <g transform="translate(80, 140)">
    <rect width="260" height="200" rx="12" fill="#131c31" stroke="#3b82f6" stroke-width="2" />
    <!-- Image landscape preview -->
    <path d="M20,160 L90,90 L150,150 L200,100 L240,160 Z" fill="#3b82f6" fill-opacity="0.3" stroke="#60a5fa" stroke-width="2" />
    <circle cx="210" cy="50" r="22" fill="#f59e0b" fill-opacity="0.7" />
    <rect x="20" y="15" width="80" height="22" rx="4" fill="#1e293b" />
    <text x="28" y="30" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Input Image</text>
  </g>

  <!-- Transformation Arrow -->
  <g transform="translate(370, 220)">
    <circle cx="30" cy="20" r="25" fill="#1e293b" stroke="#ff7b00" stroke-width="2" />
    <path d="M22,20 L38,20 M32,14 L38,20 L32,26" fill="none" stroke="#ff7b00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Right Side: Neural Decoding & Caption Result -->
  <g transform="translate(460, 140)">
    <!-- Neural Layer Representation -->
    <rect width="260" height="200" rx="12" fill="#131c31" stroke="#8b5cf6" stroke-width="2" />
    <rect x="20" y="20" width="100" height="24" rx="4" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1" />
    <text x="30" y="36" fill="#c4b5fd" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Predicted Tokens</text>
    
    <!-- Token Chips -->
    <g transform="translate(20, 60)">
      <rect width="45" height="24" rx="6" fill="#1e293b" stroke="#475569" /><text x="8" y="16" fill="#e2e8f0" font-family="monospace" font-size="12">"A"</text>
      <rect x="52" width="55" height="24" rx="6" fill="#1e293b" stroke="#475569" /><text x="60" y="16" fill="#e2e8f0" font-family="monospace" font-size="12">"dog"</text>
      <rect x="114" width="70" height="24" rx="6" fill="#1e293b" stroke="#475569" /><text x="122" y="16" fill="#e2e8f0" font-family="monospace" font-size="12">"running"</text>
      <rect x="191" width="40" height="24" rx="6" fill="#1e293b" stroke="#475569" /><text x="199" y="16" fill="#e2e8f0" font-family="monospace" font-size="12">"in"</text>
    </g>

    <!-- Final Caption Box -->
    <rect x="20" y="110" width="220" height="65" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="32" y="132" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700">GENERATED CAPTION</text>
    <text x="32" y="155" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12" font-style="italic">"A brown dog running enthusiastically across a green field."</text>
  </g>
</svg>